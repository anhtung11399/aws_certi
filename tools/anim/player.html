<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #f4f6f9; font-family: 'Be Vietnam Pro', sans-serif; color: #0f172a; }
body { background: radial-gradient(1200px 600px at 70% 10%, #ffffff 0%, #eef2f7 70%); }
#head { position: absolute; left: 0; right: 0; top: 0; height: 58px; background: #232f3e; color: #fff; display: flex; align-items: center; gap: 14px; padding: 0 26px; font-size: 17px; }
#head .chip { background: {{COLOR}}; color: #111; font-weight: 800; padding: 4px 12px; border-radius: 99px; font-size: 15px; }
#head .lt { font-weight: 700; }
#head .hs { margin-left: auto; color: #cbd5e1; font-size: 15px; }
#stage { position: absolute; inset: 0; }
#svg { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
.abbr { fill: #fff; font-weight: 800; letter-spacing: .02em; }
.nl { font-size: 17px; font-weight: 700; fill: #0f172a; }
.ns { font-size: 14px; fill: #64748b; font-weight: 500; }
.gl { font-size: 16px; font-weight: 800; }
.el { font-size: 15px; font-weight: 700; }
.bdg { font-size: 13.5px; font-weight: 800; fill: #fff; letter-spacing: .03em; }
.hscene { position: absolute; inset: 0; }
.stitle { position: absolute; left: 34px; top: 76px; font-size: 30px; font-weight: 800; letter-spacing: -.01em; border-left: 7px solid {{COLOR}}; padding-left: 14px; line-height: 1.15; }
.note { position: absolute; background: #fff; border-radius: 12px; padding: 12px 16px; font-size: 18px; line-height: 1.4; box-shadow: 0 6px 20px rgba(15,23,42,.12); border-left: 6px solid #2563eb; }
.note b { color: #1d4ed8; }
.note.c-bad { border-left-color: #dc2626; } .note.c-bad b { color: #b91c1c; }
.note.c-ok { border-left-color: #16a34a; } .note.c-ok b { color: #15803d; }
.note.c-go { border-left-color: #ff9900; } .note.c-go b { color: #c2410c; }
.note code, .li code, .big code, .tip code { font-family: ui-monospace, Menlo, monospace; font-size: .9em; background: #f1f5f9; padding: 1px 6px; border-radius: 5px; }
.tip { position: absolute; background: #fff7e6; border: 2.5px solid #ff9900; border-radius: 14px; padding: 12px 16px 14px; font-size: 18px; line-height: 1.4; box-shadow: 0 8px 22px rgba(255,153,0,.22); }
.th { display: block; font-style: normal; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #c2410c; margin-bottom: 4px; }
.tip b, .tipov b { color: #9a3412; }
.tipov { position: absolute; inset: 58px 0 108px; display: flex; align-items: center; justify-content: center; background: rgba(244,246,249,.82); }
.tipov > div { background: #fff7e6; border: 3px solid #ff9900; border-radius: 18px; padding: 22px 30px 24px; font-size: 26px; line-height: 1.45; max-width: 860px; box-shadow: 0 18px 50px rgba(255,153,0,.28); font-weight: 600; }
.tipov .th { font-size: 16px; margin-bottom: 8px; }
.panel { position: absolute; display: flex; flex-direction: column; gap: 12px; }
.li { background: #fff; border-radius: 12px; padding: 12px 18px 12px 46px; font-size: 20px; line-height: 1.35; position: relative; box-shadow: 0 4px 14px rgba(15,23,42,.08); }
.li::before { content: ''; position: absolute; left: 18px; top: 19px; width: 12px; height: 12px; border-radius: 50%; background: {{COLOR}}; }
.li.c-bad::before { background: #dc2626; } .li.c-ok::before { background: #16a34a; } .li.c-blue::before { background: #2563eb; }
.li b { color: #0f172a; }
.big { position: absolute; inset: 58px 0 108px; display: flex; align-items: center; justify-content: center; background: rgba(244,246,249,.86); }
.big > div { background: #232f3e; color: #fff; font-size: 38px; font-weight: 800; padding: 30px 46px; border-radius: 20px; text-align: center; max-width: 980px; line-height: 1.3; box-shadow: 0 18px 50px rgba(15,23,42,.3); }
.big small { display: block; font-size: 21px; font-weight: 500; color: #fbbf24; margin-top: 12px; }
.big code { background: rgba(255,255,255,.12); color: #fff; }
#sub { position: absolute; left: 90px; right: 90px; bottom: 18px; min-height: 40px; background: rgba(15,23,42,.88); color: #fff; font-size: 22px; line-height: 1.38; padding: 10px 22px; border-radius: 12px; text-align: center; font-weight: 500; }
</style></head>
<body>
<div id="head"><span class="chip">{{CODE}}</span><span class="lt">{{TITLE}}</span><span class="hs"></span></div>
<svg id="svg" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><defs></defs></svg>
<div id="stage"></div>
<div id="sub"></div>
<script>/*STORY*/</script>
<script>/*PLAYER*/</script>
</body></html>
